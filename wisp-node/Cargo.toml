[package]
name = "wisp-node"
description = "A node implementation for the Wisp blockchain, handling peer connections, block validation, and transaction processing."
include = ["src/**/*", "README.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.97"
argh = "0.1.13"
async-trait = "0.1.89"
axum = "0.8.4"
bincode = "1.3.3"
chrono = "0.4.40"
dashmap = "6.1.0"
env_logger = "0.11.8"
hex = "0.4.3"
hyper = { version = "1.7.0", features = ["full"] }
lazy_static = "1.5.0"
log = "0.4.27"
rust_decimal = "1.38.0"
rust_decimal_macros = "1.38.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sled = "0.34.7"
static_init = "1.0.3"
tempfile = "3.22.0"
tokio = { version = "1.44.1", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors"] }
uuid = { version = "1.13.1", features = ["v4", "serde"] }
wisp-core = { path = "../wisp-core" }

[dev-dependencies]
hyper = { version = "1.7.0", features = ["full"] }
serde_json = "1.0.143"
tempfile = "3.22.0"
tower = { version = "0.5.2", features = ["full"] }

[[test]]
name = "api_integration"
path = "tests/api_integration.rs"
harness = true
