[package]
name = "wisp-node"
description = "A node implementation for the Wisp blockchain, handling peer connections, block validation, and transaction processing."
include = ["src/**/*", "README.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.100"
argh = "0.1.13"
async-trait = "0.1.89"
axum = "0.8.6"
bincode = "2.0.1"
chrono = "0.4.42"
dashmap = "6.1.0"
env_logger = "0.11.8"
hex = "0.4.3"
hyper = { version = "1.7.0", features = ["full"] }
igd-next = "0.16.2"
lazy_static = "1.5.0"
log = "0.4.28"
rust_decimal = "1.39.0"
rust_decimal_macros = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sled = "0.34.7"
static_init = "1.0.4"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
wisp-core = { path = "../wisp-core" }

[dev-dependencies]
hyper = { version = "1.7.0", features = ["full"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["full"] }

[[test]]
name = "api_integration"
path = "tests/api_integration.rs"
harness = true
